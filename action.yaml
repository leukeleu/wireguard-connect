name: WireGuard connection
description: Quickly set up a WireGuard connection

inputs:
  WIREGUARD_CONFIG:
    description: WireGuard configuration
    required: true
  VERIFY_HOSTNAME:
    description: A hostname to test resolution against after the tunnel is up. Leave empty to skip this check.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install WireGuard
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y resolvconf wireguard
      shell: bash

    - name: Write config
      env:
        WG_CONFIG: ${{ inputs.WIREGUARD_CONFIG }}
      run: |
        set -euo pipefail
        sudo install -m 600 /dev/stdin /etc/wireguard/wg0.conf <<< "$WG_CONFIG"
      shell: bash

    - name: Bring up WireGuard
      run: |
        set -euo pipefail
        # Save original default route before VPN takes over
        ORIG_GW=$(ip route show default | awk '{print $3; exit}')
        ORIG_DEV=$(ip route show default | awk '{print $5; exit}')
        echo "Original gateway: $ORIG_GW via $ORIG_DEV"

        # Fetch GitHub IP ranges while original routing is still active
        GITHUB_RANGES=$(curl -fsSL --max-time 5 https://api.github.com/meta 2>/dev/null \
          | jq -r '.actions[], .api[], .git[]' 2>/dev/null \
          | grep -E '^[0-9]+\.' \
          | sort -u) || GITHUB_RANGES=""

        if [ -n "$GITHUB_RANGES" ]; then
          echo "Fetched $(echo "$GITHUB_RANGES" | wc -l) GitHub IP ranges"
        else
          echo "::warning::Could not fetch GitHub IP ranges; runner connection may be unstable"
        fi

        # Bring up WireGuard
        sudo wg-quick up wg0

        # Route GitHub traffic through original gateway to keep runner connected
        if [ -n "$GITHUB_RANGES" ]; then
          while IFS= read -r net; do
            [ -n "$net" ] || continue
            sudo ip route add "$net" via "$ORIG_GW" dev "$ORIG_DEV" 2>/dev/null || true
          done <<< "$GITHUB_RANGES"
          echo "GitHub routes added via original gateway"
        fi
      shell: bash

    - name: Wait for handshake
      run: |
        set -euo pipefail
        echo "Waiting for WireGuard handshake..."
        for i in {1..15}; do
          if sudo wg show wg0 latest-handshakes | awk '$2 != "" && $2 != "0" {ok=1} END {exit !ok}'; then
            echo "Handshake confirmed after ${i}s"
            sudo wg show wg0
            exit 0
          fi
          sleep 1
        done
        echo "::error::No WireGuard handshake after 15s"
        sudo wg show wg0
        exit 1
      shell: bash

    - name: Register DNS
      run: |
        set -euo pipefail
        DNS_LINE=$(sudo awk -F= '/^[[:space:]]*DNS[[:space:]]*=/ {sub(/^[^=]*=[[:space:]]*/,""); print; exit}' /etc/wireguard/wg0.conf)

        if [ -z "$DNS_LINE" ]; then
          echo "::warning::No DNS= line in wg0.conf"
          exit 0
        fi

        DNS_SERVERS=()
        DNS_DOMAINS=()
        IFS=',' read -ra ENTRIES <<< "$DNS_LINE"
        for entry in "${ENTRIES[@]}"; do
          entry="$(echo "$entry" | xargs)"
          [ -z "$entry" ] && continue
          if [[ "$entry" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || [[ "$entry" == *:* && "$entry" =~ ^[0-9a-fA-F:]+$ ]]; then
            DNS_SERVERS+=("$entry")
          else
            DNS_DOMAINS+=("$entry")
          fi
        done

        if [ ${#DNS_SERVERS[@]} -gt 0 ]; then
          sudo resolvectl dns wg0 "${DNS_SERVERS[@]}"
          echo "Registered DNS servers on wg0: ${DNS_SERVERS[*]}"

          # Set ~. as routing domain so resolved actually sends queries to
          # wg0's DNS server. Also set search domains from config for
          # single-label name qualification.
          DOMAIN_ARGS=("${DNS_DOMAINS[@]}" "~.")
          sudo resolvectl domain wg0 "${DOMAIN_ARGS[@]}"
          echo "Registered domains on wg0: ${DOMAIN_ARGS[*]}"
        fi

        # Ensure /etc/resolv.conf points to systemd-resolved stub so that
        # glibc-based tools (ssh, curl, etc.) route DNS through systemd-resolved,
        # which we just configured with wg0's DNS servers and ~. routing domain.
        # The resolvconf package may have replaced the symlink with its own file
        # pointing at the runner's original DNS servers.
        if ! grep -q '^nameserver 127.0.0.53' /etc/resolv.conf 2>/dev/null; then
          sudo ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
          echo "Updated /etc/resolv.conf -> systemd-resolved stub"
        fi

        resolvectl status wg0
      shell: bash

    - name: Verify name resolution
      if: ${{ inputs.VERIFY_HOSTNAME != '' }}
      env:
        VERIFY_HOSTNAME: ${{ inputs.VERIFY_HOSTNAME }}
      run: |
        set -euo pipefail
        echo "Verifying name resolution for $VERIFY_HOSTNAME..."
        for i in {1..10}; do
          if getent ahosts "$VERIFY_HOSTNAME" >/dev/null 2>&1; then
            echo "Resolution confirmed after ${i}s"
            getent ahosts "$VERIFY_HOSTNAME"
            exit 0
          fi
          sleep 1
        done
        echo "::error::Could not resolve $VERIFY_HOSTNAME"
        getent ahosts "$VERIFY_HOSTNAME" || true
        exit 1
      shell: bash
